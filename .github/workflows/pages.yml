# Short link to the demo: https://imeeba.github.io/hrideone-web/ (redirects to WordPress Playground).
# Add ?stay to see the page list instead of redirecting.
name: Demo link (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [demo-site/**]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-site
      - id: deployment
        uses: actions/deploy-pages@v4
