# Saves the text of the old hrideone.com /about/ page (TH/EN/JA) into playground/data/old-about.json.
# See scripts/fetch-old-about.py. GitHub runners can reach hrideone.com; the Claude workspace cannot.
name: Fetch old about page

on:
  workflow_dispatch:
  push:
    paths: [scripts/fetch-old-about.py, .github/workflows/fetch-old-about.yml]

permissions:
  contents: write

concurrency:
  group: fetch-old-about
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.0.0 playwright==1.49.1 && playwright install --with-deps chromium
      - name: Crawl
        run: python3 -u scripts/fetch-old-about.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playground/data/crawl playground/data/old-about.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Old about page text and screenshots"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
