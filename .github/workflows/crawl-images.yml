# Lists the images that the old hrideone.com pages show (with annotated screenshots) so they can be matched
# to the image slots of the new site. See scripts/crawl-images.py. GitHub's runners can reach hrideone.com;
# the Claude workspace cannot.
name: Crawl old site images

on:
  workflow_dispatch:
  push:
    paths: [scripts/crawl-images.py, .github/workflows/crawl-images.yml]

permissions:
  contents: write

concurrency:
  group: crawl-images
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.0.0 playwright==1.49.1 && playwright install --with-deps chromium
      - name: Crawl
        run: python3 -u scripts/crawl-images.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playground/data/crawl
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Crawl: images on the old site pages (with annotated screenshots)"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
